plugins {
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

java {
    sourceCompatibility = targetCompatibility = JavaVersion.VERSION_17
}

// mixin 的 refmap 要 FG 生成的 named→SRG 映射来产出，所以 compileJava 必须等 createMcpToSrg
tasks.named('compileJava') {
    dependsOn 'createMcpToSrg'
    def refmap = file("${buildDir}/classes/java/main/${project.mod_id}.refmap.json")
    options.compilerArgs += [
            '-AreobfTsrgFile=' + file("${buildDir}/createMcpToSrg/output.tsrg").absolutePath,
            '-AoutRefMapFile=' + refmap.absolutePath,
    ]
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // 移植期一次看全所有错误，省得改一轮才冒出下一百个
    options.compilerArgs << '-Xmaxerrs' << '4000'
}

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    // mixin 注解处理器（:processor 那个 classifier）只在 Sponge 仓有
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

minecraft {
    // 1.20.1 Forge 的 dev 侧用 Mojang 官方映射；运行期是 SRG 名，重映射由 FG 负责
    mappings channel: project.mappings_channel, version: project.mappings_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('./run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.debug.export', 'true'
        }

        client {
            mods {
                "${project.mod_id}" {
                    source sourceSets.main
                }
            }
        }

        server {
            args '--nogui'
            mods {
                "${project.mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"
    // 只有注解处理器需要 mixin；运行期 mixin 由 Forge 自带
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // 前置：官方 TACZ 与它的 Geckolib。只要编译期符号，运行期由 runClient 的 mods 目录提供。
    compileOnly files('../forge-deps/tacz-1.20.1-1.1.7-hotfix.jar')
    compileOnly files('../forge-deps/geckolib-forge-1.20.1-4.4.9.jar')
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : project.mod_id,
                'Implementation-Title'    : project.mod_id,
                'Implementation-Version'  : project.version,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                // Forge 1.20.1 靠这个清单属性找到 mixin 配置
                'MixinConfigs'                : "${project.mod_id}.mixins.json"
        ])
    }
}
